<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout — BookNook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><header class="header"><a class="brand" href="index.html"><span>📚</span> BookNook</a><nav><a href="products.html">Books</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><a class="cart-link" href="cart.html">🛒 <b id="cartCount">0</b></a></header>
<main class="checkout"><p class="eyebrow">Almost there</p><h1>Checkout</h1><div class="checkout-grid"><form id="checkoutForm" class="card"><h2>Shipping details</h2><div class="form-grid"><label>Full name<input required id="name"></label><label>Phone<input required pattern="[0-9]{10}" id="phone"></label><label class="full">Email<input required type="email" id="email"></label><label class="full">Address<input required id="address"></label><label>City<input required id="city"></label><label>PIN code<input required pattern="[0-9]{6}" id="pin"></label></div><h2>Payment method</h2><label class="radio"><input type="radio" name="pay" value="cod" checked> Cash on Delivery</label><label class="radio"><input type="radio" name="pay" value="upi"> UPI (demo)</label><label class="radio"><input type="radio" name="pay" value="card"> Card (demo)</label><button class="btn full-btn">Place order</button></form><aside id="checkoutSummary" class="summary card"></aside></div></main><footer><small>© 2026 BookNook. Demo checkout — no real payment is processed.</small></footer><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
