<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shop — BookNook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><header class="header"><a class="brand" href="index.html"><span>📚</span> BookNook</a><nav><a href="index.html">Home</a><a class="active" href="products.html">Books</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="head-actions"><button class="icon-btn" onclick="toggleSearch()">⌕</button><a class="cart-link" href="cart.html">🛒 <b id="cartCount">0</b></a></div></header>
<div id="searchBar" class="searchbar hidden"><input id="searchInput" placeholder="Search books, authors, stationery..." oninput="renderProducts()"></div>
<main class="shop"><div class="shop-title"><p class="eyebrow">The collection</p><h1>Books & stationery</h1><p>Browse stories, knowledge and desk companions.</p></div>
<div class="shop-layout"><aside class="filters"><h3>Filter</h3><label>Search<input id="q" placeholder="Title or author"></label><label>Category<select id="category"><option value="">All categories</option><option>Fiction</option><option>Non-Fiction</option><option>Children</option><option>Stationery</option></select></label><label>Language<select id="language"><option value="">All languages</option><option>English</option><option>Tamil</option><option>Hindi</option></select></label><label>Max price <span id="priceVal">₹1500</span><input type="range" id="price" min="100" max="1500" value="1500"></label><label>Rating<select id="rating"><option value="0">Any rating</option><option value="4">4★ & above</option><option value="4.5">4.5★ & above</option></select></label><button class="btn secondary" onclick="clearFilters()">Clear filters</button></aside>
<section><div class="toolbar"><span id="resultCount"></span><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="rating">Top rated</option></select></div><div id="productGrid" class="product-grid"></div></section></div></main>
<footer><div><b>📚 BookNook</b><p>A warm little bookstore for big ideas.</p></div><div><a href="about.html">About</a><a href="contact.html">Contact</a><a href="cart.html">Cart</a></div><small>© 2026 BookNook.</small></footer>
<script src="js/data.js"></script><script src="js/app.js"></script></body></html>
